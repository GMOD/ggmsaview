name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2, any::pkgload
      # NAMESPACE alone: another roxygen2 version can format man/ differently,
      # and R CMD check's codoc step catches a help page whose usage disagrees
      # with its function
      - name: Check NAMESPACE matches the roxygen tags
        run: |
          Rscript -e 'roxygen2::roxygenise(roclets = "namespace")'
          git diff --exit-code -- NAMESPACE
      # every gallery recipe runs, and the README table and docs/gallery.md
      # match the examples scripts/gallery.R holds
      - name: Run the gallery recipes
        run: |
          Rscript scripts/gallery.R --check
          git diff --exit-code -- README.md docs/gallery.md
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
